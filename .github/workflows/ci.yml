name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format source
        run: |
          cargo fmt
          cargo fmt --manifest-path editors/zed/Cargo.toml
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src editors/zed
            git commit -m "style: format Zed and LSP sources"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Test
        run: cargo test --all-targets
      - name: Run LSP handshake
        run: |
          cargo build --quiet
          python3 - <<'PY'
          import json
          import subprocess
          proc = subprocess.Popen(["target/debug/sashimi", "lsp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          request = json.dumps({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}).encode()
          proc.stdin.write(f"Content-Length: {len(request)}\r\n\r\n".encode() + request)
          proc.stdin.flush()
          headers = {}
          while True:
              line = proc.stdout.readline().decode().strip()
              if not line:
                  break
              key, value = line.split(":", 1)
              headers[key.lower()] = value.strip()
          response = json.loads(proc.stdout.read(int(headers["content-length"])))
          assert response["result"]["serverInfo"]["name"] == "sashimi-lsp"
          proc.kill()
          PY
      - name: Check Zed extension
        run: |
          rustup target add wasm32-wasip2
          cargo check --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Test Rust dev shell
        run: nix develop --command cargo test --all-targets
