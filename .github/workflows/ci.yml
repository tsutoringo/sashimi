name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Test
        run: cargo test --all-targets
      - name: Check example
        run: cargo run -- check examples/hello.sashimi
      - name: Format
        run: cargo fmt --check
